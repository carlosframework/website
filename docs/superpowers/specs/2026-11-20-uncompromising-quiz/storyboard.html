const PULL = { onedb: 'Postgres', idle: 'A CDN', pager: 'Redis', hello: 'Sidekiq' };
function statement(id, k, st, note) {
  const n = ORDER.indexOf(k) + 1, s = S.s[k], left = MINE.length - (st === 'no' ? 1 : 0);
  const react = st === 'q' ? `<p class="wait">The reaction appears here, in place. The space is kept so nothing on the screen jumps.</p>` :
    `<p class="say">${st === 'yes' ? s.yes : s.no}</p>${st === 'no' ? `<p class="gone"><s>${PULL[k]}</s> out of your pile. ${left} left.</p><br>` : ''}<span class="next">Next <kbd>Enter</kbd></span>`;
  return `<section class="f"><div class="screen">${bar(n, n - 1 + (st === 'q' ? 0 : 1))}
    <div class="txt"><p class="eye">${n} of 12</p><h2>${s.q}</h2><div class="ans"><span class="${st === 'yes' ? 'on' : st === 'no' ? 'off' : ''}">${S.yes}<kbd>1</kbd></span><span class="${st === 'no' ? 'on' : st === 'yes' ? 'off' : ''}">${S.no}<kbd>2</kbd></span></div><div class="react">${react}</div></div>
    <div class="pic">${ill(k, st)}</div><div class="mine">${mine(st, PULL[k])}</div></div>${cap(id, `Statement ${n}, ${st === 'q' ? 'asked' : st === 'yes' ? 'after “Absolutely”' : 'after “Absolutely not”'}`, note)}</section>`;
}
const chips = on => `<div class="chips">${THINGS.map(t => `<span class="${on.includes(t) ? 'on' : ''}">${t}</span>`).join('')}</div>`;
function picker(id, on, note) {
  const stage = M ? `<svg viewBox="0 0 354 250">${gnd(226, 0, 354)}${pile(on, 140, 226, 84, 22, 2, { fs: 11.5 })}${on.length ? brick(98, 30, 84, 22, 'A CDN', { rot: -9, fs: 11.5 }) + `<path d="M140 16 v-22" stroke="${INK}" stroke-opacity=".4" stroke-dasharray="2 4"/>` : `<rect x="82" y="150" width="116" height="76" rx="4" fill="none" stroke="${INK}" stroke-opacity=".4" stroke-dasharray="4 5"/>`}${cell(306, 226 - 34 * .98, 34, { seed: 1, flat: .98 })}${L(0, 244, on.length ? `${on.length + 1} things to run` : 'your pile goes here', 'start')}</svg>`
    : `<svg viewBox="0 0 660 560">${gnd(510, 0, 660)}${pile(on, 290, 510, 132, 32, 2, { fs: 14 })}${on.length ? brick(222, 206, 132, 32, 'A CDN', { rot: -8, fs: 14 }) + `<path d="M288 190 v-60" stroke="${INK}" stroke-opacity=".4" stroke-dasharray="2 4"/>` : `<rect x="204" y="390" width="172" height="120" rx="4" fill="none" stroke="${INK}" stroke-opacity=".4" stroke-dasharray="4 5"/>`}${cell(560, 510 - 60 * .98, 60, { seed: 1, flat: .98 })}${L(0, 538, on.length ? `${on.length + 1} things to run` : 'your pile goes here', 'start')}</svg>`;
  return `<section class="f"><div class="screen pick"><div class="bar"><span class="back">← Back</span><span class="name">How uncompromising are you?</span><span class="prog"><span>Before we start</span></span></div>
    <div class="txt"><h2>${S.stack.title}</h2><p class="big" style="margin:${M ? 6 : 0}px 0 0">${S.stack.hint}</p>${chips(on.length ? [...on, 'A CDN'] : [])}<span class="next">${S.stack.done}</span><span class="fresh">${S.stack.fresh}</span></div>
    <div class="stage">${stage}</div></div>${cap(id, on.length ? 'Stack picker, with a pile' : 'Stack picker, empty', note)}</section>`;
}
const paste = `<div class="paste"><div><small>${S.result.cta}</small>Follow the directions on https://carlosframework.com/start</div><span class="copy">Copy</span></div>`;
// The share image: one per result title. 1200 x 630.
const SHARE = { all: () => cell(250, 270, 150, { wake: 1, seed: 2, inside: brick(296, 262, 88, 36, 'one', { fs: 18 }) }),
  most: () => gnd(430, 0, 480) + pile(['Kubernetes', 'Terraform', 'A CDN'], 110, 430, 150, 38, 1, { fs: 17 }) + cell(350, 430 - 110 * .98, 110, { seed: 2, flat: .98 }),
  few: () => gnd(436, 0, 480) + pile(['Rails', 'Postgres', 'Redis', 'Sidekiq', 'Docker', 'Kubernetes', 'Nginx', 'Heroku', 'S3'], 120, 436, 150, 36, 1, { fs: 17 }) + cell(366, 436 - 84 * .56 * .98, 84, { sad: 1, sx: 1.3, sy: .56, flat: .98, seed: 2 }) };
const share = k => `<div class="share${S.result[k].length > 40 ? ' long' : ''}" data-k="${k}"><p class="q">${S.title}</p><p class="v">${S.result[k]}</p><svg viewBox="0 0 480 520">${SHARE[k]()}</svg><p class="u">${S.hero.replace('Not sure? ', '')} <span>carlosframework.com/uncompromising</span></p></div>`;

document.body.insertAdjacentHTML('beforeend', [
`<section class="f"><div class="screen mid"><span class="home">CARLOS</span><svg class="hero" viewBox="0 0 200 200">${cell(100, 100, 62, { seed: 1 })}</svg><h1>${S.title}</h1><p class="big">${S.intro}</p><span class="start">${S.start}</span></div>
  ${cap('1', 'Intro', 'The cell story’s hero, reused: the cell above one sentence, breathing once every four seconds. One button. Enter starts. Nothing else is on the page, and the site header is reduced to the word CARLOS, which links home.')}</section>`,
picker('2A', [], 'Each chip is a checkbox. The floor is empty and the cell waits beside it. “Nothing yet, I’m starting fresh” skips the pile; the quiz then runs with no bricks and ends on “Starting fresh? Start with one.” The sixteen names are placeholders and are not yet in the copy deck.'),
picker('2B', MINE.slice(0, 8), 'A tap drops one brick from the top of the stage; it lands, rocks once and goes to sleep. Untick it and that brick lifts back out. The count under the floor follows. This is the homepage’s tower physics with a smaller world: at most sixteen bodies, asleep unless touched.'),
statement('3A', 'onedb', 'q', 'One statement, its picture, two answers of equal weight. Neither button is the “primary” one: the quiz must not lead the witness. Keys 1 and 2 answer; left and right move between the buttons.'),
statement('3B', 'onedb', 'yes', '“Absolutely”: the picture stays as it is. The cell sags, flattens and loses a little colour, then recovers when the visitor moves on. The reaction is one deadpan line. The pile is untouched.'),
statement('3C', 'onedb', 'no', '“Absolutely not”: the picture changes to the fact, the cell brightens with two thin rings (no bloom), and one brick leaves the pile. Here it is Postgres, because that is the brick this fact is about. Where no brick matches, the top one goes.'),
statement('4A', 'idle', 'q', 'A night picture sits on the day page as a dark panel. In the dark theme the panel loses its edge and the page is the night.'),
statement('4B', 'idle', 'yes', 'Same picture, sagging cell.'),
statement('4C', 'idle', 'no', 'The cells in the picture are asleep; one wakes for the single request. The cell beside the pile is awake too. No brick is named for this fact, so the top one goes.'),
statement('7A', 'pager', 'q', 'The joke is in two labels: “Cache: down. You: up.”'),
statement('7B', 'pager', 'yes', 'Same picture, sagging cell.'),
statement('7C', 'pager', 'no', 'Redis leaves the pile. In the picture there is only an outline where the cache server stood.'),
statement('6A', 'hello', 'q', 'Nine boxes wired together to hold up one small sign.'),
statement('6B', 'hello', 'yes', 'The one statement whose picture changes on “Absolutely”: the tenth service from the reaction line turns up underneath to watch the other nine.'),
statement('6C', 'hello', 'no', 'One cell and the same sign.'),
`<section class="f tall"><div class="screen"><div class="sheethead"><h2>The twelve illustrations</h2><p>Left: what the joke looks like. Right: the fact, shown after “Absolutely not”. Each is drawn on one 400 × 280 board with a few short labels.</p></div>
  <div class="sheet">${ORDER.map((k, i) => `<div><h3><small>${i + 1}</small>${S.s[k].q}</h3><div class="pair"><figure>${ill(k, 'q')}<figcaption>the joke</figcaption></figure><figure>${ill(k, 'no')}<figcaption>the fact</figcaption></figure></div></div>`).join('')}</div></div>
  ${cap('8', 'Contact sheet', M ? 'At this size the labels inside the pictures are left out; the shapes have to carry each one. On a real phone each picture is drawn 354 px wide, as in frames 3A to 7C.' : 'All twenty-four pictures. Statements 4 and 7 are night scenes. Every fact picture has the cell in it; no joke picture does.')}</section>`,
`<section class="f"><div class="screen"><div class="bar"><span class="back">← Back</span><span class="name">How uncompromising are you?</span><span class="prog">${[...Array(12)].map(() => '<i class="on"></i>').join('')}<span>Your result</span></span></div>
  <div class="txt"><h2 style="font-size:${M ? 30 : 46}px;margin-bottom:${M ? 10 : 16}px">${S.result.all}</h2><p class="count">${S.result.count.replace('{before}', '9')}</p>${paste}<div class="acts"><span class="sh">${S.result.share}</span><u>${S.result.again}</u></div></div>
  <div class="stage">${M ? `<svg viewBox="0 64 354 186">${gnd(226, 0, 354)}<g opacity=".45">${[0, 1, 2, 3, 4].map(i => `<rect x="${14 + (i % 2) * 8}" y="${204 - i * 26}" width="80" height="21" fill="none" stroke="${INK}" stroke-dasharray="3 4"/>`).join('')}</g>${arr(112, 170, 136, 170, { dash: 1 })}${brick(144, 158, 54, 24, '9 → 1', { fs: 11, op: .6 })}${arr(210, 170, 228, 170, { dash: 1 })}${cell(292, 226 - 56 * .98, 56, { wake: 1, seed: 2, flat: .98, inside: brick(306, 168, 32, 18, 'one', { fs: 10 }) })}</svg>`
    : `<svg viewBox="0 0 660 560">${gnd(510, 0, 660)}<g opacity=".45">${[...Array(9)].map((_, i) => `<rect x="${24 + (i % 2) * 10}" y="${478 - i * 37}" width="128" height="32" fill="none" stroke="${INK}" stroke-dasharray="3 4"/>`).join('')}</g>${L(92, 538, 'where the pile was')}${arr(188, 420, 246, 420, { dash: 1 })}${brick(256, 400, 96, 40, '9 → 1', { fs: 16, op: .6 })}${arr(372, 420, 404, 420, { dash: 1 })}${cell(530, 510 - 100 * .98, 100, { wake: 1, seed: 2, flat: .98, inside: brick(556, 404, 56, 30, 'one', { fs: 14 }) })}${L(530, 538, 'the cell takes it in')}</svg>`}</div></div>
  ${cap('9', 'The result', 'Three moments, drawn here in one picture: what is left of the pile drops into a single block; the block slides across the floor; the cell takes it in, swells, and settles back to the size it started. Then the count, the paste line and Share. About two seconds in all, once, and it can be skipped with any key.')}</section>`,
`<section class="f tall"><div class="screen"><div class="thumbs">${['all', 'most', 'few'].map(k => `<div>${share(k)}<p>share-${k} · 1200 × 630</p></div>`).join('')}</div>
  <div class="preview">${['all', 'few'].map(k => `<div class="bubble">${share(k)}<div class="meta"><b>${S.title}</b>${S.desc}<br><small>carlosframework.com</small></div></div>`).join('')}</div></div>
  ${cap('10', 'Share images', M ? 'How the card looks in a phone’s message thread, 354 px wide. The verdict is still readable at this size; the address is the smallest thing that has to be.' : 'One image per result title. The quiz’s question, the verdict, the cell in the mood that matches, the address. No score and no stack: the image is the same for everyone with that result, so nothing personal is in it and nothing is made on a server.')}</section>`,
`<section class="f tall"><div class="screen"><div class="plain"><h1>${S.title}</h1><p class="big">${S.intro}</p><ol>${ORDER.slice(0, M ? 4 : 5).map(k => `<li><b>${S.s[k].q}</b><span>${S.s[k].no}</span></li>`).join('')}<li style="list-style:none;color:var(--soft)">… and ${M ? 'eight' : 'seven'} more.</li></ol>${paste}</div></div>
  ${cap('11', 'Without script', 'What the page is before any script runs, and all it is if none does: the twelve statements as a numbered list, each with its fact, and the paste line. No buttons that cannot work. The sentence under the title needs a no-script variant, since nobody is keeping score here.')}</section>`,
].join(''));
if (!M) document.body.insertAdjacentHTML('beforeend', `<div class="fullshares">${['all', 'most', 'few'].map(share).join('')}</div>`);
</script>
