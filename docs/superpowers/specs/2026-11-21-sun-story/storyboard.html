<html lang="en">
<meta charset="utf-8">
<title>CARLOS story, round 4: the sun (draft storyboard)</title>
<link rel="stylesheet" href="sun.css">
<style>
  :root { --ink:#14232b; --soft:#4c5a60; --teal:#067a68; --btn:#1b5e50; --paper:#f4f7f1; --line:#d3dbd0; --lilac:#b394f2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #2a2a28; font: 17px/1.5 Inter, Roboto, 'Helvetica Neue', 'Arial Nova', 'Nimbus Sans', Arial, sans-serif; color: var(--ink); }
  .f { position: relative; width: 1280px; height: 720px; margin: 24px auto; overflow: hidden; display: flex; align-items: center; gap: 40px; padding: 56px 64px 48px; background: var(--paper); }
  .f.night { background: #101c23; color: #e9f0ee; --ink:#e9f0ee; --soft:#a9b9bd; --teal:#2fd4ac; --line:#2c4049; }
  .tag { position: absolute; left: 64px; top: 20px; font: 12px/1 ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .tag b { color: var(--ink); }
  .draft { position: absolute; right: 64px; top: 20px; font: 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; color: var(--soft); }
  .rail { position: absolute; right: 64px; bottom: 16px; display: flex; gap: 7px; align-items: center; font: 11px/1 ui-monospace, Menlo, Consolas, monospace; color: var(--soft); }
  .rail i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .45; }
  .rail i.on { opacity: 1; background: var(--sun); border-color: var(--sun-edge); }
  .rail span { margin-left: 6px; }
  .txt { flex: 0 0 440px; }
  h1, h2 { margin: 0 0 12px; letter-spacing: -.025em; line-height: 1.08; }
  h2 { font-size: 36px; }
  p { margin: 0 0 12px; color: var(--soft); } p.big { font-size: 20px; line-height: 1.35; } p.ink { color: var(--ink); font-weight: 600; }
  .eye { font: 600 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin: 0 0 12px; }
  .src { font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--soft); margin: 12px 0 0; }
  .note { font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; color: var(--soft); border: 1px dashed currentColor; border-radius: 6px; padding: 6px 8px; margin: 10px 0 0; }
  .paste { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--ink); text-align: left; }
  .paste small { display: block; color: var(--soft); font-size: 12px; margin-bottom: 2px; }
  .copy { margin-left: auto; background: var(--btn); color: #fff; border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .stage { flex: 1; height: 100%; position: relative; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .lab { font: 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; fill: var(--soft); }
  .hint { font: italic 14px Inter, Roboto, Arial, sans-serif; fill: var(--soft); }
  .in { font: 600 12px Inter, Roboto, Arial, sans-serif; fill: #063f37; }
  .blk rect, .blk polygon { stroke: #2b2f33; stroke-width: 1; }
  .blk text { font: 500 13px Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #17191c; }
  .slider { margin: 14px 0 4px; font-size: 13px; color: var(--soft); }
  .slider .track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); position: relative; margin: 10px 0 12px; }
  .slider .track::after { content: ""; position: absolute; left: 34%; top: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--teal); }
  .bars div { height: 14px; border-radius: 3px; margin: 3px 0 9px; background: var(--teal); }
  /* hero */
  .f.hero { display: block; text-align: center; padding: 44px 64px 40px; }
  .sky { position: relative; height: 236px; margin: 0 auto; max-width: 1040px; }
  .sky svg { position: absolute; left: 50%; top: 50%; width: 190px; height: 190px; transform: translate(-50%, -50%); }
  .sky .w { position: absolute; left: var(--x); top: var(--y); font-weight: 600; font-size: var(--s, 20px); color: #0a5a4d; white-space: nowrap; letter-spacing: -.01em; }
  .sky .w::before { content: ""; display: inline-block; width: .42em; height: .42em; border: 1.5px solid var(--teal); border-radius: 50%; margin-right: .4em; vertical-align: .12em; opacity: .7; }
  .hero h1 { font-size: 78px; font-weight: 750; margin: 0; }
  .unc { color: var(--teal); position: relative; display: inline-block; }
  .unc span { display: inline-block; }
  .unc i { position: absolute; border: 1.5px solid var(--teal); border-radius: 50%; }
  .with { font-size: 38px; font-weight: 650; color: var(--ink); letter-spacing: -.02em; margin: 6px 0 0; line-height: 1.2; }
  .hero .paste { width: 600px; margin: 26px auto 0; }
  .hero .under { font-size: 13px; margin: 10px auto 0; max-width: 500px; }
  .hn { position: absolute; width: 300px; text-align: left; margin: 0; }
  .plainlist { list-style: none; margin: 16px auto 0; padding: 0; max-width: 820px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 22px; font-size: 20px; font-weight: 600; color: #0a5a4d; }
  /* grouped words */
  .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 26px; margin: 0; }
  .groups div { border-top: 1px solid var(--line); padding-top: 8px; font-size: 15px; font-weight: 600; color: #0a5a4d; line-height: 1.45; }
  .groups small { display: block; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); font-weight: 400; margin-bottom: 2px; }
  .svgbox { height: 100%; }
  .orbit { fill: none; stroke: var(--sun-edge); stroke-opacity: .28; stroke-dasharray: 2 6; }
  .ray { fill: none; stroke: var(--sun-edge); stroke-opacity: .55; stroke-width: 1.2; stroke-dasharray: 2 6; stroke-linecap: round; }
  .f.night .hint, .f.night .lab { fill: var(--soft); } .f.night .paste { background: #17262e; } .f.night .unc, .f.night .sky .w { color: var(--teal); }
  /* character sheet */
  .f.sheet { display: block; height: auto; padding: 50px 64px 40px; }
  .f.sheet h2 { font-size: 28px; margin-bottom: 4px; } .f.sheet h3 { font: 600 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 22px 0 8px; }
  .top { display: grid; grid-template-columns: 470px 1fr; gap: 30px; align-items: center; }
  .top > svg { height: 300px; } .sizes { display: flex; align-items: flex-end; gap: 26px; } .sizes div { text-align: center; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--soft); }
  .sizes svg { display: block; margin: 0 auto 6px; flex: none; }
  .tiles { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 8px; text-align: center; background: var(--paper); cursor: pointer; }
  .tile svg { height: 112px; } .tile b { display: block; font-size: 14px; color: var(--ink); } .tile small { display: block; font: 10.5px/1.35 ui-monospace, Menlo, Consolas, monospace; color: var(--soft); }
  .tiles.night .tile { background: #101c23; border-color: #2c4049; --ink:#e9f0ee; --soft:#a9b9bd; }
  .versus { display: grid; grid-template-columns: 300px 1fr; gap: 30px; align-items: center; } .versus svg { height: 150px; }
  table { border-collapse: collapse; font-size: 14px; width: 100%; } th, td { text-align: left; padding: 5px 12px 5px 0; border-top: 1px solid var(--line); vertical-align: top; } th { font-weight: 600; color: var(--soft); }
  /* variants */
  .vrow { display: grid; grid-template-columns: 190px repeat(5, 1fr); align-items: center; border-top: 1px solid var(--line); height: 176px; }
  .vrow:first-of-type { border-top: 0; }
  .vrow h3 { margin: 0 0 4px; font-size: 21px; letter-spacing: -.02em; } .vrow p { font-size: 13px; line-height: 1.35; margin: 0; }
  .vrow svg { height: 150px; }
  .vhead { display: grid; grid-template-columns: 190px repeat(5, 1fr); font: 11px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); text-align: center; margin-bottom: 2px; }
  .f.var { display: block; padding-top: 50px; }
  .f.var h2 { font-size: 26px; margin-bottom: 6px; }
  /* ending */
  .words { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 16px; font-weight: 600; color: #0a5a4d; }
  .words li { text-decoration: underline; text-decoration-color: rgba(6,122,104,.4); text-underline-offset: 4px; }
  /* 390 px frames */
  .m .f { width: 390px; height: 880px; flex-direction: column; gap: 14px; padding: 44px 18px 34px; align-items: stretch; }
  .m .stage { order: -1; flex: 0 0 330px; } .m .txt { flex: 1; }
  .m .f.long { height: auto; } .m .f.long .stage { order: 1; flex: none; height: auto; } .m .f.long .txt { flex: none; }
  .m .f.long .svgbox { height: 250px; }
  .m h2 { font-size: 27px; } .m p.big { font-size: 17px; }
  .m .tag { left: 18px; right: 18px; font-size: 10.5px; white-space: nowrap; overflow: hidden; } .m .draft { display: none; } .m .rail { right: 18px; bottom: 10px; } .m .rail span { display: none; }
  .m .lab { font-size: 19px; } .m .hint { font-size: 23px; } .m .in { font-size: 19px; } .m .blk text { font-size: 19px; }
  .m .f.hero { padding: 40px 18px 30px; }
  .m .sky { height: 268px; } .m .sky svg { width: 150px; height: 150px; }
  .m .sky .w { left: var(--mx); top: var(--my); font-size: 15.5px; }
  .m .hero h1 { font-size: 45px; } .m .with { font-size: 27px; }
  .m .hero .paste { width: auto; margin-top: 20px; } .m .hero .under { max-width: none; } .m .hn { position: static; width: auto; margin-top: 12px; }
  .m .plainlist { font-size: 16px; gap: 2px 14px; }
  .m .groups { grid-template-columns: 1fr 1fr; gap: 10px 14px; } .m .groups div { font-size: 14px; }
  .m .f.var { height: auto; } .m .vhead { display: none; }
  .m .vrow { grid-template-columns: repeat(3, 1fr); height: auto; padding: 12px 0 4px; } .m .vrow > div { grid-column: 1 / -1; } .m .vrow svg { height: 104px; }
  .m .vrow svg:nth-of-type(2), .m .vrow svg:nth-of-type(5) { display: none; }
  .m .f.sheet { padding: 44px 18px 30px; } .m .top, .m .versus { grid-template-columns: 1fr; gap: 10px; } .m .top > svg { height: 250px; } .m .sizes { gap: 2px; } .m .top > * { min-width: 0; }
  .m .tiles { grid-template-columns: repeat(3, 1fr); } .m .tile svg { height: 92px; } .m table { font-size: 12.5px; }
  .m .words { font-size: 15px; gap: 4px 12px; }
</style>
<body>
<script src="sun.js"></script>
<script>
if (location.search.includes('m')) document.documentElement.classList.add('m');
const M = location.search.includes('m');
function slab(x, y, w, h, o = {}) {
  const d = o.d ?? 12, fill = o.fill ?? '#ffffff', top = o.top ?? '#eef2ea', side = o.side ?? '#d7ddd2', op = o.op ?? 1, rot = o.rot ? ` transform="rotate(${o.rot} ${x + w / 2} ${y + h / 2})"` : '';
  return `<g class="blk" opacity="${op}"${rot}><polygon points="${x},${y} ${x + d},${y - d * .6} ${x + w + d},${y - d * .6} ${x + w},${y}" fill="${top}"/>` +
    `<polygon points="${x + w},${y} ${x + w + d},${y - d * .6} ${x + w + d},${y + h - d * .6} ${x + w},${y + h}" fill="${side}"/>` +
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>` + (o.label ? `<text x="${x + w / 2}" y="${y + h / 2 + 5}" text-anchor="middle">${o.label}</text>` : '') + `</g>`;
}
const TOWER = ['App backend', 'App frontend', 'Background workers', 'Web server', 'Observability layer', 'Containers', 'Microservices', 'Cluster orchestrator', 'App server', 'Database server', 'Memory cache', 'Load balancer', 'Cloud provider'];
const ground = (y = 560) => `<line x1="-20" y1="${y}" x2="720" y2="${y}" stroke="currentColor" stroke-opacity=".25"/>`;
const lab = (x, y, t, a = 'middle') => `<text class="lab" x="${x}" y="${y}" text-anchor="${a}">${t}</text>`;
// Carloku's character, for the one place the two meet: a lilac block with eyes. Drawn from carloku.com's own symbol.
const block = (x, y, s, inside = '') => `<g transform="translate(${x} ${y}) scale(${s})"><rect width="26.25" height="21" rx="1.5" fill="#b394f2" stroke="#1d1927" stroke-width=".5"/>${inside}<rect x="8" y="8" width="2" height="4.5" fill="#17223b"/><rect x="16.25" y="8" width="2" height="4.5" fill="#17223b"/></g>`;
const rail = n => `<div class="rail">${[1, 2, 3, 4, 5, 6].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}<span>· Copy the line</span></div>`;
const frame = (n, name, cls, text, stage, lit) => `<section class="f sun-day ${cls}"><span class="tag"><b>${n}</b> · ${name}</span><span class="draft">DRAFT COPY · STORYBOARD</span>` +
  `<div class="txt">${text}</div><div class="stage">${stage}</div>${lit == null ? '' : rail(lit)}</section>`;
const paste = `<div class="paste"><div><small>Paste this into your agent and it can take things from there</small>Follow the directions on https://carlosframework.com/start</div><span class="copy">Copy</span></div>`;
const under = `<p class="under">Your agent asks what you want to make, builds it, and gives you a public link for 24 hours. No account or install needed.</p>`;
// "uncompromising", fizzing: each letter sits a hair off the baseline, and a few small rings rise from the word.
const unc = (bub = 1) => `<span class="unc">${[...'uncompromising'].map((c, i) => `<span style="transform:translateY(${[-1.5, 1, 0, 1.5, -1, .5, -1.5, 1.5, 0, -1, 1, -.5, 1.5, -1][i]}px)">${c}</span>`).join('')}` +
  (bub ? [[6, -4, 7, .8], [19, -15, 4, .5], [33, -7, 9, .7], [47, -19, 5, .45], [61, -5, 6, .8], [78, -13, 8, .6], [91, -3, 4, .7]].map(([x, y, s, o]) => `<i style="left:${x}%;top:${M ? y * .6 : y}px;width:${s}px;height:${s}px;opacity:${o}"></i>`).join('') : '') + `</span>`;
const WORDS = [['secure', 6, 16, 24, 2, 6], ['private', 21, 58, 21, 0, 30], ['exciting', 3, 78, 20, 4, 78], ['accessible', 24, 6, 20, 30, 0], ['lower-cost', 9, 44, 19, 2, 53], ['globally distributed', 63, 6, 21, 46, 92],
  ['deployable', 80, 30, 22, 70, 30], ['decentralisable', 66, 52, 20, 60, 64], ['resilient', 86, 76, 23, 72, 6], ['lightweight', 62, 82, 19, 4, 92], ['open', 32, 84, 24, 78, 79]];
const cloud = WORDS.map(([w, x, y, s, mx, my]) => `<span class="w" style="--x:${x}%;--y:${y}%;--s:${s}px;--mx:${mx}%;--my:${my}%">${w}</span>`).join('');
// Two faint orbits behind the words: the attributes hang round the sun. They do not turn.
const orbits = `<svg viewBox="0 0 1040 236" preserveAspectRatio="none" style="width:100%;height:100%;left:0;top:0;transform:none"><ellipse class="orbit" cx="520" cy="118" rx="${M ? 400 : 330}" ry="${M ? 100 : 84}"/><ellipse class="orbit" cx="520" cy="118" rx="${M ? 500 : 480}" ry="${M ? 122 : 116}"/></svg>`;
const hero = (n, name, sky, h1, extra, cls = '') => `<section class="f hero sun-day ${cls}"><span class="tag"><b>${n}</b> · ${name}</span><span class="draft">DRAFT COPY · STORYBOARD</span>` +
  `<div class="sky">${sky}</div>${h1}<p class="with">with CARLOS</p>${extra}</section>`;
const one = (o = {}) => `<svg viewBox="0 0 200 200">${sun(100, 100, 62, o)}</svg>`;
const tileSVG = (inner) => `<svg viewBox="0 0 160 150">${inner}</svg>`;
const STATES = [
  ['rest', 'Rest', 'breathes once every 4 s', () => sun(80, 78, 34)],
  ['swell', 'Swell', '400 ms out, 600 ms back', () => sun(80, 78, 34, { state: 'swell' })],
  ['squish', 'Squish', '400 ms, eases out', () => `<line x1="20" y1="112" x2="140" y2="112" stroke="currentColor" stroke-opacity=".3"/>` + sun(80, 78, 34, { state: 'squish' })],
  ['', 'Dividing', '500 ms, the deck’s glide', () => sun(80, 78, 30, { split: .8, tilt: -32 })],
  ['', 'Divided', 'each ring redraws, 300 ms', () => sun(50, 100, 26, { thick: 1 }) + sun(112, 56, 26, { thick: 1 })],
  ['asleep', 'Asleep', '1.4 s down, 300 ms up', () => sun(80, 78, 34, { state: 'asleep' })],
  ['', 'Set', 'asleep, half under a line', () => `<line x1="20" y1="92" x2="140" y2="92" stroke="currentColor" stroke-opacity=".4"/>` + sun(80, 92, 34, { state: 'asleep', horizon: 92 })],
  ['bright', 'Bright', '300 ms, then one ring, 600 ms', () => sun(80, 78, 34, { state: 'bright' })],
  ['ghost', 'Ghost', 'a still: where it was or could be', () => sun(80, 78, 34, { state: 'ghost' })]];
const tiles = night => `<div class="tiles ${night ? 'night sun-night' : ''}">${STATES.map(([k, n, t, f]) => `<div class="tile" data-s="${k}">${tileSVG(f())}<b>${n}</b><small>${t}</small></div>`).join('')}</div>`;

document.body.insertAdjacentHTML('beforeend', [
hero('H1', 'Hero at rest: the word fizzes', one(),
  `<h1>Build ${unc()} apps</h1>`,
  `${paste}${under}
   <p class="note hn" style="left:64px;bottom:26px">THE FIZZ. Unchanged. Each letter of the word drifts about 1 px off the line. At most six small rings rise from it at a time and fade within 16 px. They are the same shape as the character now: small circles.</p>
   <p class="note hn" style="right:64px;bottom:26px">THE SUN. A small amber circle with a soft glow, a thin ring round it and a smaller circle inside. No face. It breathes once every four seconds. That is all it does here.</p>`),

hero('H2', 'Hero with the attributes out, on two orbits', orbits + one({ state: 'swell' }) + cloud,
  `<h1>Build ${unc(0)} apps</h1>`,
  `${paste}
   <p class="note hn" style="left:64px;bottom:26px">HOW IT OPENS. As before: by itself, once, about a second after the page settles. The rings grow into the words, hold for four seconds and sink back. Hover or focus holds it open. A tap opens it and a second tap closes it.</p>
   <p class="note hn" style="right:64px;bottom:26px">NEW: the words hang on two faint orbits round the sun. The orbits do not turn. The sun swells a little while the words are out.</p>`),

hero('H3', 'Hero with reduced motion or no script: the list is simply there', one(),
  `<h1>Build ${unc(0)} apps</h1>`,
  `<ul class="plainlist">${WORDS.map(w => `<li>${w[0]}</li>`).join('')}</ul>${paste}
   <p class="note hn" style="left:64px;bottom:26px">Nothing moves and nothing is hidden. The same list sits under the headline. The sun is a still.</p>`),

hero('H4', 'Hero in the dark theme: where the glow reads best', one(),
  `<h1>Build ${unc()} apps</h1>`,
  `${paste}${under}
   <p class="note hn" style="left:64px;bottom:26px">The same sun on the dark theme. It is the deck’s amber on the deck’s kind of ground, so it needs no outline here. On the light page it has a thin darker line to hold its edge.</p>`, 'night sun-night'),

frame('U', '“What does uncompromising mean?”', 'long',
  `<h2>What does uncompromising mean?</h2>
   <p class="big">Most apps are built on compromises. There was never enough time, so something had to give.</p>
   <p>Accessibility waited for version two. Security became a ticket. Everyone’s data went into one database, because one each was too much work.</p>
   <p class="ink">Building apps with AI means we no longer have to cut corners.</p>
   <p>But agents cut corners too, unless the careful way is also the easy way. CARLOS makes it the easy way. So one app can be all of these at once.</p>`,
  `<div class="svgbox" style="height:${M ? 250 : 330}px"><svg viewBox="0 0 700 330">
     <polygon points="92,60 228,60 270,102 270,238 228,280 92,280 50,238 50,102" fill="#fff" stroke="#2b2f33" stroke-width="1.5"/>
     ${[[50, 60, 92, 60, 50, 102], [270, 60, 228, 60, 270, 102], [270, 280, 270, 238, 228, 280], [50, 280, 50, 238, 92, 280]].map(p => `<polygon points="${p[0]},${p[1]} ${p[2]},${p[3]} ${p[4]},${p[5]}" fill="none" stroke="#2b2f33" stroke-dasharray="3 4" stroke-opacity=".6"/>`).join('')}
     <text class="in" x="160" y="176" text-anchor="middle" style="fill:#17191c">The usual app</text>
     <text class="lab" x="50" y="${M ? 36 : 44}">accessibility, later</text><text class="lab" x="50" y="${M ? 316 : 304}">one shared database</text>
     ${M ? '' : `<text class="lab" x="284" y="84">one region</text><text class="lab" x="284" y="262">backups, nightly</text>`}
     ${sun(540, 166, 88)}
     <text class="hint" x="540" y="${M ? 324 : 316}" text-anchor="middle">No corners to cut.</text></svg></div>
   <div class="groups"><div><small>For the people using it</small>secure · private · accessible · exciting</div><div><small>For whoever pays for it</small>lower-cost · lightweight</div>
     <div><small>For when something breaks</small>resilient · globally distributed</div><div><small>For whoever owns it</small>open · deployable · decentralisable</div></div>
   <p class="src">The joke is cleaner than it was: a plain circle beside a square with its corners cut off.</p>`, 0),

frame('C1', 'Chapter 1: everything it needs is inside', '',
  `<p class="eye">lightweight</p><h2>Everything it needs is inside.</h2>
   <p>A CARLOS app is one file: web server, database, background jobs and interface. Nothing to wire together, so nothing to come loose.</p>
   <p class="ink">Go on, give it a poke.</p>
   <p class="src">The parts of the usual pile drift in and become four small points inside its ring. It swells as it takes them and settles back to the size it started. Poke it and it squishes and springs back. Nothing falls out.</p>`,
  `<svg viewBox="0 0 700 620">${ground()}
   ${TOWER.map((t, i) => i % 3 === 1 ? '' : slab(20 + (i * 53 % 30), 150 + i * 31, 120 + (i * 37 % 40), 24, { op: .2 + (i % 4) * .12, d: 8, rot: i % 2 ? 2 : -2.5 })).join('')}
   ${[[226, 226, 12, 54, 16], [276, 300, -9, 34, 12]].map(([x, y, a, w, h], i) => slab(x, y, w, h, { d: 6, rot: a, op: .7 - i * .2 })).join('')}<circle cx="336" cy="346" r="7" fill="#fff" stroke="var(--sun-edge)" stroke-width="1.5"/>
   <path d="M215 250 C 270 240, 300 290, 328 340" fill="none" stroke="currentColor" stroke-opacity="${.45}" stroke-dasharray="3 6"/>
   ${sun(480, 340, 120)}<circle class="orbit" cx="480" cy="340" r="96"/>
   ${[[-125, 'interface'], [-55, 'web server'], [55, 'jobs'], [125, 'database']].map(([a, t]) => { const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180), up = s < 0;
     return `<circle cx="${480 + c * 96}" cy="${340 + s * 96}" r="8" fill="#fff" stroke="var(--sun-edge)" stroke-width="1.5"/><text class="in" x="${480 + c * 158}" y="${340 + s * 158 + (up ? -4 : M ? 22 : 14)}" text-anchor="middle">${t}</text>`; }).join('')}
   <text class="lab" x="100" y="590" text-anchor="middle">${M ? '13 parts' : 'The usual pile · 13 parts'}</text><text class="lab" x="480" y="590" text-anchor="middle">${M ? '1' : 'The same app · 1'}</text></svg>`, 1),

frame('C2', 'Chapter 2: it divides, one for each customer, each with its own ring', '',
  `<p class="eye">secure · private</p><h2>One each.</h2>
   <p>Every customer gets their own copy of the app, with their own database inside it. What keeps two customers apart is a wall, not a line in a query.</p>
   <p class="ink">Try to read next door.</p>
   <p class="src">A new customer: the circle becomes two, and each draws its own ring. Drag from one copy towards another’s and the line stops at the ring.</p>`,
  `<svg viewBox="0 0 700 620">${ground()}
   ${sun(350, 150, 50, { split: .8, tilt: -24 })}<text class="lab" x="350" y="${M ? 60 : 72}" text-anchor="middle">A new customer signs up</text>
   <path d="M270 215 C 200 260, 150 300, 130 350 M350 222 V 340 M430 215 C 500 260, 550 300, 570 350" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="3 6"/>
   ${['Acme', 'Birch', 'Cobalt'].map((n, i) => sun(120 + i * 230, 458, 80, { thick: 1 }) + lab(120 + i * 230, M ? 590 : 584, n)).join('')}
   <path d="M150 440 C 190 360, 240 360, 270 414" fill="none" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="6 5"/>
   <path d="M258 402 l22 24 m0 -24 l-22 24" stroke="#b3261e" stroke-width="3"/>
   <text class="hint" x="${M ? 20 : 60}" y="${M ? 318 : 330}">${M ? 'Nowhere to go.' : 'A request from Acme’s copy for Birch’s data has nowhere to go.'}</text></svg>`, 2),

frame('C3', 'Chapter 3: asleep until it’s needed. The idle ones have set', 'night sun-night',
  `<p class="eye">lower-cost</p><h2>Asleep until it’s needed.</h2>
   <p>A copy nobody is using runs nothing. The next request wakes it in under half a second, with nothing lost.</p>
   <div class="slider">Traffic: about 2,000 requests a day<div class="track"></div>
     <div class="bars">Awake about 3 hours in 24 (illustrative)<div style="width:12.5%"></div>A server that never sleeps: 24 in 24<div style="width:100%;opacity:.35"></div></div></div>
   <p class="src">Asleep, a copy dims and sets: half of it is under its line. A request touches one and it rises and brightens. Tap a sleeping one to wake it.</p>`,
  `<svg viewBox="0 0 700 620">
   ${[0, 1, 2].map(r => `<line x1="${20 + (r % 2) * 40}" y1="${300 + r * 125}" x2="${640 + (r % 2) * 40}" y2="${300 + r * 125}" stroke="currentColor" stroke-opacity=".28"/>`).join('')}
   ${[...Array(15)].map((_, i) => { const c = i % 5, r = (i / 5) | 0, x = 80 + c * 130 + (r % 2) * 40, y = 300 + r * 125, on = i === 7;
     return on ? sun(x, y - 56, 50, { state: 'bright' }) : sun(x, y, 34, { state: 'asleep', horizon: y }); }).join('')}
   <circle cx="150" cy="90" r="5" fill="#ffe7a8"/><path d="M150 90 C 230 150, 300 230, 368 322" fill="none" stroke="#ffe7a8" stroke-dasharray="2 7"/>
   <text class="lab" x="168" y="86">A request arrives</text><text class="lab" x="380" y="${M ? 458 : 448}" text-anchor="middle">Awake</text></svg>`, 3),

frame('C4', 'Chapter 4: lose one, keep the rest. A light goes out and is lit again from its copy', '',
  `<p class="eye">resilient</p><h2>Lose one, keep the rest.</h2>
   <p>Every change is copied off the server as it is written. If a server stops, the app starts again on another one from its copy. Every other customer carries on.</p>
   <p class="ink">Stop a server.</p>
   <p class="note">HONEST NUMBERS, unchanged from 20 November. Planned work: requests wait a few seconds. A server that fails without warning: up to 15 minutes today, and about the last second of writes can be lost. High availability is on Carloku’s US region, for accounts that have it.</p>`,
  `<svg viewBox="0 0 700 620">${ground()}
   ${slab(20, 520, 300, 40, { label: 'Server one', d: 26, fill: '#e6ebe2', op: .75 })}
   ${[[70, 462], [160, 470], [250, 462], [110, 388], [205, 392]].map(([x, y]) => sun(x, y, 36, { state: 'ghost' })).join('')}
   <path d="M60 500 l14 22 l-16 10 l18 26" fill="none" stroke="#2b2f33" stroke-width="2.5"/>
   ${slab(400, 520, 280, 40, { label: 'Server two', d: 26 })}
   ${[[450, 462], [540, 470], [630, 462], [495, 388]].map(([x, y]) => sun(x, y, 36)).join('')}${sun(590, 396, 20, { state: 'bright' })}
   <ellipse cx="350" cy="150" rx="150" ry="62" fill="#fff" stroke="#2b2f33"/>
   ${[0, 1, 2, 3, 4].map(i => `<circle cx="${262 + i * 44}" cy="${150 + (i % 2) * 10 - 5}" r="8" fill="var(--sun)" stroke="var(--sun-edge)" stroke-width="1.5"/>`).join('')}
   <text class="lab" x="350" y="${M ? 62 : 72}" text-anchor="middle">Storage · a copy of every database</text>
   <path class="ray" d="M150 340 C 150 270, 220 230, 262 190 M438 190 C 500 230, 580 300, 590 365" style="stroke-width:2;stroke-opacity:.9"/>
   <text class="hint" x="${M ? 0 : 20}" y="${M ? 318 : 290}">each write, as it happens</text><text class="hint" x="${M ? 400 : 500}" y="${M ? 318 : 290}">lit again from its copy</text></svg>`, 4),

frame('C5', 'Chapter 5: at home anywhere. The same circle wherever it sits', '',
  `<p class="eye">deployable · open · globally distributed</p><h2>At home anywhere.</h2>
   <p>The same file runs on Carloku, on your own servers, on a small VPS or on a laptop, in whichever region is nearest the people using it. The specification is open, and you can run the platform yourself.</p>
   <p class="ink">Drop it somewhere else.</p>
   <p class="src">It no longer takes the shape of what holds it. It is the same circle in every one, which is the point: nothing is rebuilt to fit. On a plain server the app runs by itself. The sleeping, copying and moving come from the platform, hosted or your own.</p>`,
  `<svg viewBox="0 0 700 620">${ground()}
   <path d="M20 420 v120 a20 20 0 0 0 20 20 h110 a20 20 0 0 0 20 -20 v-120" fill="none" stroke="#2b2f33" stroke-width="2"/>${sun(95, 496, 50)}
   <rect x="200" y="330" width="130" height="230" rx="4" fill="none" stroke="#2b2f33" stroke-width="2"/><line x1="200" y1="445" x2="330" y2="445" stroke="#2b2f33" stroke-opacity=".4"/>${sun(265, 502, 50, { state: 'ghost' })}
   <rect x="368" y="440" width="120" height="120" rx="4" fill="none" stroke="#2b2f33" stroke-width="2"/>${sun(428, 500, 50, { state: 'ghost' })}
   <rect x="535" y="420" width="130" height="126" rx="6" fill="none" stroke="#2b2f33" stroke-width="2"/><path d="M515 560 h170 l-10 -14 h-150z" fill="none" stroke="#2b2f33" stroke-width="2"/>${sun(600, 484, 50, { state: 'ghost' })}
   <text class="lab" x="95" y="590" text-anchor="middle">Carloku</text><text class="lab" x="265" y="590" text-anchor="middle">Your servers</text><text class="lab" x="428" y="590" text-anchor="middle">${M ? 'A VPS' : 'A small VPS'}</text><text class="lab" x="600" y="590" text-anchor="middle">A laptop</text>
   <path d="M120 400 C 170 300, 330 290, 410 410" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M410 410l-13-4 9-11z"/>
   <text class="hint" x="150" y="270">Same file. Same size. Nothing rebuilt.</text></svg>`, 5),

frame('C6', 'Chapter 6: nothing in the middle, and glue as faint rays', '',
  `<p class="eye">decentralisable</p><h2>Nothing in the middle.</h2>
   <p>Every copy stands by itself, so nothing has to sit in the centre holding everyone’s data. Where copies need something shared, thin services pass it along and keep nothing.</p>
   <p class="ink">Take the glue away.</p>
   <p class="src">The rays go; every light stays on. Customers lose a convenience, never their data. Copies gather but never join: joining would be shared data.</p>
   <p class="note">Shared email, storage, PDFs, schedules and a call relay work today. Relays and brokers of your own are a pattern in use. Pegamento is a design direction, with no code. The labels from “Fair questions” apply here too.</p>`,
  `<svg viewBox="0 0 700 620">
   <circle cx="350" cy="310" r="74" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="3 7"/><text class="hint" x="350" y="${M ? 318 : 315}" text-anchor="middle">${M ? 'empty' : 'nothing here'}</text>
   ${[0, 1, 2, 3, 4, 5, 6].map(i => { const a = i / 7 * Math.PI * 2 - 1.2, x = 350 + Math.cos(a) * 190, y = 310 + Math.sin(a) * 225, tx = i % 2 ? 615 : 85, ty = i % 2 ? 300 : 322, d = Math.hypot(tx - x, ty - y);
     return `<path class="ray" d="M${x + (tx - x) / d * 46} ${y + (ty - y) / d * 46} L ${tx} ${ty}"/>` + sun(x, y, 42); }).join('')}
   <rect x="5" y="302" width="80" height="40" rx="8" fill="#fff" stroke="#2b2f33"/><text class="in" x="45" y="${M ? 329 : 327}" text-anchor="middle" style="fill:#17191c">relay</text>
   <rect x="615" y="280" width="80" height="40" rx="8" fill="#fff" stroke="#2b2f33" stroke-dasharray="4 4"/><text class="in" x="655" y="${M ? 307 : 305}" text-anchor="middle" style="fill:#17191c">broker</text>
   <text class="lab" x="5" y="${M ? 374 : 362}">${M ? 'keeps' : 'passes it on,'}</text><text class="lab" x="5" y="${M ? 398 : 378}">${M ? 'nothing' : 'keeps nothing'}</text><text class="lab" x="695" y="${M ? 352 : 340}" text-anchor="end">${M ? 'holds' : 'holds the'}</text><text class="lab" x="695" y="${M ? 376 : 356}" text-anchor="end">one key</text></svg>`, 6),

frame('T', 'The turn: real apps, each a pile beside its lights', '',
  `<h2>But surely not every app can be like this?</h2>
   <p class="big">These are real products. Each one is drawn beside the pile it would usually have needed.</p>
   <p>Ticketing, a shared inbox, a code host, an office suite, a messenger, a mail service. <u>See all the apps</u></p>
   <p class="src">Each app is a handful of lights, one per customer, with what one of them is. Hover or tap an app and its pile folds into one of its lights, the same move as chapter 1. Each pile is that team’s own list, or it is not drawn.</p>`,
  `<svg viewBox="0 0 700 620">${ground()}
   ${[['Tito', 'Ticketing', 'One per organiser', 11, 5], ['Jelly', 'Shared inbox', 'Run it yourself', 8, 1], ['Amadan', 'Git forge and CI', 'One per repository', 10, 6], ['Oficina', 'Office suite', 'One per team', 7, 4]].map(([n, what, per, pile, copies], i) => { const x = 20 + i * 172;
     return [...Array(pile)].map((_, j) => slab(x + (j * 7 % 10), 540 - j * 24, 52 + (j * 13 % 14), 17, { d: 5, op: .55 })).join('') +
       [...Array(copies)].map((_, j) => { const col = j % 2, row = (j / 2) | 0, last = j === copies - 1 && copies % 2; return sun(x + 96 + (last ? 20 : col * 40), 538 - row * 44, 18); }).join('') +
       `<text x="${x + 78}" y="${M ? 150 : 170}" text-anchor="middle" style="font:700 ${M ? 30 : 21}px Inter, Arial, sans-serif;fill:var(--ink)">${n}</text>` + lab(x + 78, M ? 180 : 192, M ? '' : what) + lab(x + 78, 590, M ? per.replace('One per ', '1 / ').replace('Run it yourself', 'yours') : per); }).join('')}</svg>`, 6),

frame('E', 'The ending: the words come back, and the sun meets Carloku’s block', 'long',
  `<h2>Build uncompromising apps<br><span style="font-size:.62em;font-weight:650">with CARLOS</span></h2>
   <p>Every word from the top of the page, and where you saw it.</p>
   <ul class="words">${WORDS.map(w => `<li>${w[0]}</li>`).join('')}</ul>
   ${paste}<p style="font-size:13px;margin-top:10px">Rather set it up yourself? <u>Get started by hand</u></p>`,
  `<div class="svgbox" style="height:${M ? 250 : 520}px"><svg viewBox="0 0 700 520">
   ${[[90, 110, 30], [176, 62, 22], [150, 180, 26], [250, 126, 34], [62, 204, 20]].map(([x, y, r]) => sun(x, y, r)).join('')}
   <path d="M290 160 C 340 210, 370 240, 420 280" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M420 280l-14-2 7-12z"/>
   ${block(400, 262, 8, '')}<path d="M640 480 l40 40" stroke="#2b2f33" stroke-width="7" stroke-linecap="round"/><circle cx="596" cy="436" r="62" fill="#f4f7f1" stroke="#2b2f33" stroke-width="3"/>${sun(596, 436, 34)}
   <text class="lab" x="505" y="${M ? 246 : 250}" text-anchor="middle">Your app, on Carloku</text>
   <text class="hint" x="${M ? 0 : 40}" y="${M ? 300 : 290}">${M ? 'This is what’s inside.' : 'What you built here is what’s inside.'}</text>
   <text class="hint" x="40" y="${M ? 336 : 314}">${M ? '' : 'Round and amber, no face. Square and lilac, with eyes.'}</text>
   <text class="in" x="40" y="${M ? 400 : 380}" style="fill:#5b3e96">Want it hosted? Start with Carloku →</text></svg></div>`, 6),

`<section class="f sheet sun-day"><span class="tag"><b>S</b> · Character sheet: the CARLOS sun, every state</span><span class="draft">PROVISIONAL · FOR PAUL</span>
   <h2>The character: a small sun</h2><p style="max-width:860px">Four circles: a glow, a ring, a body and a core. No face, no eyes, nothing in a pair. The core is a smaller circle and never a database. In a browser, click a state to see it move.</p>
   <div class="top"><svg viewBox="0 0 ${M ? 520 : 500} 300">${sun(150, 150, 84)}
     ${[[250, 60, 'Glow', 'four faint discs, to 1.75 r', 54], [222, 108, 'Ring', 'its boundary, r', 104], [194, 140, 'Body', 'amber, 0.6 r', 154], [156, 156, 'Core', 'a smaller circle, 0.23 r', 204]].map(([x, y, a, b, ty]) => `<path d="M${x} ${y} L 300 ${ty + 4} h 8" fill="none" stroke="currentColor" stroke-opacity=".5"/><text x="314" y="${ty + 2}" style="font:600 14px Inter, Arial, sans-serif;fill:var(--ink)">${a}</text><text class="lab" x="314" y="${ty + 20}" style="text-transform:none;letter-spacing:0;font-size:11px">${b}</text>`).join('')}</svg>
     <div><h3 style="margin-top:0">Sizes: the ring’s diameter</h3><div class="sizes">${[[120, 'hero'], [96, 'hero, 390 px'], [56, 'quiz, by the pile'], [32, 'in a picture'], [13, 'rail']].filter(([d]) => !M || d < 120).map(([d, t]) => `<div><svg style="width:${d * (M ? 1.5 : 1.9)}px;height:${d * (M ? 1.5 : 1.9)}px" viewBox="${-d * .95} ${-d * .95} ${d * 1.9} ${d * 1.9}">${sun(0, 0, d / 2)}</svg>${d} px<br>${t}</div>`).join('')}</div>
       <h3>Live</h3><div style="display:flex;align-items:center;gap:18px"><div id="live" style="width:120px;flex:none">${sunSVG()}</div><p style="font-size:14px;margin:0">This one breathes. Click a state below and it changes, with the real timing, then click again to bring it back to rest.</p></div></div></div>
   <h3>States, on the light page</h3>${tiles(0)}
   <h3>States, at night and in the dark theme</h3>${tiles(1)}
   <h3>Beside Carloku’s block: never mistaken for each other</h3>
   <div class="versus"><svg viewBox="0 0 300 150">${sun(76, 76, 42)}${block(170, 34, 4)}</svg>
     <table><tr><th></th><th>The CARLOS sun</th><th>Carloku’s block</th></tr><tr><th>Shape</th><td>A circle</td><td>A square block</td></tr><tr><th>Colour</th><td>Amber, with a glow</td><td>Lilac, flat</td></tr>
       <tr><th>Face</th><td>None, ever</td><td>Two eyes; it blinks and dozes</td></tr><tr><th>Speaks by</th><td>Its light and its size</td><td>Its eyes</td></tr><tr><th>Stands for</th><td>A CARLOS app, from the inside</td><td>Your app with somewhere to live</td></tr></table></div></section>`,
].join(''));
// The sheet's tiles drive the live sun.
const live = document.querySelector('#live .sun');
document.querySelectorAll('.tile[data-s]').forEach(t => t.addEventListener('click', () => { const s = t.dataset.s; if (s && live) live.dataset.state = live.dataset.state === s ? 'rest' : s; }));
</script>
</body>
</html>
