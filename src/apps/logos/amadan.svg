<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Amadan logo: a geometric dunce cap with branch arms and legs. Source
       of truth for the mark is assets/logo/ on the main branch; this copy
       is embedded in the hub binary and adapts to the viewer's color
       scheme (the presentation attributes are the light palette, so the
       mark degrades to light colors wherever the style block is ignored). -->
  <style>
    @media (prefers-color-scheme: dark) {
      .limb { stroke: #EDE4D3; }
      .cap { stroke: #F6EFDF; }
    }
  </style>
  <g class="limb" stroke="#3A2E25" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M101.5 111.5 L70 111.5 L45.5 135.5"/>
    <path d="M157 120 L194 83"/>
    <path d="M94 186.5 L94 227.5"/>
    <path d="M162 186.5 L162 227.5"/>
  </g>
  <path class="cap" d="M128 29 L203 193.5 L53 193.5 Z" fill="#F6EFDF" stroke="#3A2E25" stroke-width="12" stroke-linejoin="round"/>
  <!-- The scrawl: a "/" — the separator in a repo path, and the fada
       amadán loses when it becomes amadan. -->
  <path d="M93 170.5 L117 117.5" stroke="#C9502E" stroke-width="12" stroke-linecap="round"/>
  <g fill="#C9502E">
    <circle cx="45.5" cy="135.5" r="11"/>
    <circle cx="194" cy="83" r="11"/>
    <circle cx="94" cy="227.5" r="11"/>
    <circle cx="162" cy="227.5" r="11"/>
  </g>
</svg>
